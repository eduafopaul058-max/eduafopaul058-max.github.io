<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency app</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f3; --text: #18181b; --muted: #52525b; --ink: #18181b; --on-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --text: #f4f4f5; --muted: #b4b4bc; --ink: #f4f4f5; --on-ink: #18181b; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 380px; width: 100%; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: var(--ink); color: var(--on-ink); font-weight: 600; text-decoration: none; }
  ol { color: var(--muted); padding-left: 20px; margin: 20px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Content Agency</h1>
  <p>The app for checking and approving your videos.</p>
  <a class="btn" href="Agency.apk" download>Download the app</a>
  <ol>
    <li>Open the downloaded file.</li>
    <li>If asked, allow installing from this source.</li>
    <li>Tap Install, then Open.</li>
  </ol>
</main>
</body>
</html>
